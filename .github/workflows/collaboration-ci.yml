name: Collaboration CI

on:
  pull_request:
    paths:
      - 'compagnon/**'
      - 'supabase/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/collaboration-ci.yml'
  push:
    branches:
      - feat/collaboration-platform

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Sync environment
        run: uv sync
      - name: Compile Python
        run: uv run python -m compileall compagnon
      - name: Tests
        run: uv run pytest -q

  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure service role is not used by Python client
        shell: bash
        run: |
          if grep -R "SUPABASE_SERVICE_ROLE_KEY" compagnon; then
            echo "service_role must never be embedded in the Hub client"
            exit 1
          fi
      - name: Ensure migrations enable RLS
        shell: bash
        run: |
          grep -q "enable row level security" supabase/migrations/202607260001_collaboration_platform.sql
          grep -q "set_user_role" supabase/migrations/202607260001_collaboration_platform.sql
          grep -q "review_translation" supabase/migrations/202607260001_collaboration_platform.sql

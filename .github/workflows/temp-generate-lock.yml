name: Temporary Generate Lock

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collaboration branch
        uses: actions/checkout@v4
        with:
          ref: feat/collaboration-platform
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Generate lockfile
        run: uv lock
      - name: Verify frozen sync
        run: uv sync --frozen
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh uv lockfile"
          git push origin HEAD:feat/collaboration-platform
